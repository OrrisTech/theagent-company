# Fly.io deployment config for The Agent Company
# Deploy with: fly launch

app = "theagent-company"

[build]
  dockerfile = "Dockerfile.cloud"

[env]
  PORT = "3100"
  HOST = "0.0.0.0"
  SERVE_UI = "true"
  TAC_CLOUD_MODE = "true"
  TAC_DEPLOYMENT_MODE = "authenticated"
  TAC_DEPLOYMENT_EXPOSURE = "private"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
  internal_port = 3100
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

[checks]
  [checks.alive]
    type = "http"
    port = 3100
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
