services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tac
      POSTGRES_PASSWORD: tac
      POSTGRES_DB: tac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tac -d tac"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://tac:tac@db:5432/tac
      PORT: "3100"
      SERVE_UI: "true"
      TAC_CLOUD_MODE: "true"
      TAC_DEPLOYMENT_MODE: "authenticated"
      TAC_DEPLOYMENT_EXPOSURE: "private"
      TAC_PUBLIC_URL: "${TAC_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - tac-data:/tac
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  tac-data:
